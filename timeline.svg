<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" width="820" height="372" role="img" aria-label="The same instant on two timelines. At tick 5,112 the server has the enemy 17 pixels from the player, inside a 20 pixel kill distance, so it kills. The player's screen draws the enemy from tick 5,104, 30 pixels away, so the two dots are still 12 pixels apart." font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
  <rect width="820" height="372" fill="#ffffff"/>
  <defs>
    <marker id="ft-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16181d"/>
    </marker>
  </defs>
  <line x1="24" y1="196" x2="796" y2="196" stroke="#d7dbd3" stroke-width="1"/>

  <text x="24" y="106" fill="#16181d" font-size="12" font-weight="700" letter-spacing="1.2">SERVER</text>
  <text x="24" y="124" fill="#5a606a" font-size="12">tick 5,112</text>
  <text x="24" y="274" fill="#16181d" font-size="12" font-weight="700" letter-spacing="1.2">YOUR SCREEN</text>
  <text x="24" y="292" fill="#5a606a" font-size="12">enemy from tick 5,104</text>

  <text x="300" y="64" fill="#5a606a" font-size="12" text-anchor="middle">you</text>
  <text x="372" y="64" fill="#d4343c" font-size="12" text-anchor="middle">enemy</text>
  <circle cx="300" cy="112" r="36" fill="#16181d" fill-opacity="0.08" stroke="#16181d" stroke-width="2"/>
  <circle cx="368" cy="112" r="36" fill="#d4343c" fill-opacity="0.2" stroke="#d4343c" stroke-width="2"/>
  <line x1="442" y1="112" x2="412" y2="112" stroke="#16181d" stroke-width="1.5" marker-end="url(#ft-arrow)"/>
  <text x="450" y="116" fill="#5a606a" font-size="12">100 px/s</text>
  <line x1="300" y1="154" x2="300" y2="170" stroke="#5a606a" stroke-width="1"/>
  <line x1="368" y1="154" x2="368" y2="170" stroke="#5a606a" stroke-width="1"/>
  <line x1="300" y1="164" x2="368" y2="164" stroke="#16181d" stroke-width="1.25"/>
  <text x="334" y="184" fill="#16181d" font-size="12" text-anchor="middle" font-weight="700">17 px</text>

  <text x="590" y="108" fill="#16181d" font-size="13" font-weight="700">17 px &lt; 20 px kill distance</text>
  <text x="590" y="127" fill="#5a606a" font-size="12">server: contact, so it kills</text>

  <text x="368" y="214" fill="#d4343c" font-size="12" text-anchor="middle">server position now</text>
  <text x="300" y="232" fill="#5a606a" font-size="12" text-anchor="middle">you</text>
  <text x="414" y="232" fill="#d4343c" font-size="12">drawn 8 ticks late</text>
  <circle cx="300" cy="280" r="36" fill="#16181d" fill-opacity="0.08" stroke="#16181d" stroke-width="2"/>
  <circle cx="368" cy="280" r="36" fill="none" stroke="#d4343c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="421" cy="280" r="36" fill="#d4343c" fill-opacity="0.2" stroke="#d4343c" stroke-width="2"/>
  <line x1="421" y1="280" x2="372" y2="280" stroke="#16181d" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#ft-arrow)"/>
  <line x1="336" y1="322" x2="336" y2="338" stroke="#5a606a" stroke-width="1"/>
  <line x1="385" y1="322" x2="385" y2="338" stroke="#5a606a" stroke-width="1"/>
  <line x1="336" y1="332" x2="385" y2="332" stroke="#16181d" stroke-width="1.25"/>
  <text x="360" y="352" fill="#16181d" font-size="12" text-anchor="middle" font-weight="700">12 px gap</text>

  <text x="590" y="258" fill="#16181d" font-size="13" font-weight="700">30 px apart</text>
  <text x="590" y="277" fill="#5a606a" font-size="12">dots touch at 18 px</text>
  <text x="590" y="296" fill="#5a606a" font-size="12">13.3 px = 8 ticks at 100 px/s</text>
</svg>
